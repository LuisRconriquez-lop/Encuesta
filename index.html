<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Computación Básica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna centrada tipo hoja de examen; cada pregunta toma un color de la paleta; barra de progreso fija abajo */
:root{
  --bg:#f3f5fb; --paper:#ffffff; --ink:#16203a; --muted:#56627a; --line:#dde2ee;
  --accent:#0033a0; --brand:#0033a0; --logo-filter:none;
  --c1:#0033a0; --c2:#e6337a; --c3:#f59e0b; --c4:#10a37f; --c5:#7c3aed; --c6:#0ea5e9;
  --ok:#14804a; --ok-soft:#e3f6ec; --bad:#c2352c; --bad-soft:#fde8e6;
  --blob-a:#c9d6ff; --blob-b:#ffd3e4; --blob-c:#fff0c2;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --paper:#182036; --ink:#eef1f8; --muted:#a3adc4; --line:#2a3452;
  --accent:#8aa8ff; --brand:#ffffff; --logo-filter:brightness(0) invert(1);
  --c1:#8aa8ff; --c2:#ff6fa5; --c3:#ffc04d; --c4:#3ad6a4; --c5:#b28cff; --c6:#4cc9f0;
  --ok:#5fd19a; --ok-soft:#14352a; --bad:#ff8a80; --bad-soft:#3d1d22;
  --blob-a:#1d2b5c; --blob-b:#45193a; --blob-c:#3a2f12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --paper:#182036; --ink:#eef1f8; --muted:#a3adc4; --line:#2a3452;
  --accent:#8aa8ff; --brand:#ffffff; --logo-filter:brightness(0) invert(1);
  --c1:#8aa8ff; --c2:#ff6fa5; --c3:#ffc04d; --c4:#3ad6a4; --c5:#b28cff; --c6:#4cc9f0;
  --ok:#5fd19a; --ok-soft:#14352a; --bad:#ff8a80; --bad-soft:#3d1d22;
  --blob-a:#1d2b5c; --blob-b:#45193a; --blob-c:#3a2f12; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding:0 16px;min-height:100vh;
  background:
    radial-gradient(600px 400px at 0% 0%, var(--blob-a), transparent 70%),
    radial-gradient(500px 400px at 100% 10%, var(--blob-b), transparent 70%),
    radial-gradient(600px 500px at 50% 100%, var(--blob-c), transparent 70%),
    var(--bg);
  background-attachment:fixed}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-block:40px 130px;display:grid;gap:20px}
header{display:grid;gap:10px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-bottom:20px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.tec-logo{height:88px;width:auto;filter:var(--logo-filter)}
.brand-sep{width:1px;align-self:stretch;background:var(--line)}
.prepanet{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,40px);line-height:1;color:var(--brand);letter-spacing:-.02em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c2)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,46px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.02em}
.hl{background:linear-gradient(transparent 62%, var(--hl) 62%, var(--hl) 92%, transparent 92%);padding:0 .08em}
.hl1{--hl:color-mix(in srgb, var(--c6) 40%, transparent)}
.hl2{--hl:color-mix(in srgb, var(--c2) 35%, transparent)}
.hl3{--hl:color-mix(in srgb, var(--c3) 45%, transparent)}
.lead{color:var(--muted);margin:0;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:12px;padding:4px 10px;border-radius:999px;background:color-mix(in srgb, var(--c) 14%, var(--paper));color:var(--ink);border:1px solid color-mix(in srgb, var(--c) 35%, transparent)}

.q{--c:var(--c1);position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;
  box-shadow:0 1px 0 var(--line), 0 10px 24px -18px color-mix(in srgb, var(--c) 70%, transparent)}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.q-num{font-family:var(--f-display);font-weight:800;font-size:14px;color:#fff;background:var(--c);padding:4px 12px;border-radius:999px}
.q-pts{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.q-text{margin:0;font-weight:600;font-size:18px}
.opts{display:grid;gap:8px;min-width:0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--c);transform:translateY(-1px)}
.opt input{margin:4px 0 0;accent-color:var(--c);flex-shrink:0;width:18px;height:18px}
.opt:has(input:checked){border-color:var(--c);background:color-mix(in srgb, var(--c) 13%, var(--paper));font-weight:600}
.opt:has(input:focus-visible){outline:2px solid var(--c);outline-offset:2px}
.opt.pop{animation:pop .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tag{margin-left:auto;font-family:var(--f-mono);font-size:12px;white-space:nowrap;padding-top:3px}
.opt.correct .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)}
.explain{margin:0;font-size:15px;color:var(--muted);background:color-mix(in srgb, var(--c) 8%, var(--paper));border-radius:8px;padding:10px 12px}
.q.graded.right{border-color:var(--ok)} .q.graded.miss{border-color:var(--bad)}
.stamp{position:absolute;top:-12px;right:16px;font-family:var(--f-display);font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px;color:#fff;animation:stamp .5s cubic-bezier(.3,1.8,.5,1) both}
.stamp.ok{background:var(--ok)} .stamp.no{background:var(--bad)}
@keyframes stamp{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(-4deg)}}
.locked .opt{cursor:default} .locked .opt:hover{transform:none}

.result{position:relative;background:var(--paper);border-radius:16px;padding:24px;display:grid;gap:8px;
  border:3px solid transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box, linear-gradient(120deg,var(--c1),var(--c6),var(--c4),var(--c3),var(--c2),var(--c5)) border-box}
.score{font-family:var(--f-display);font-weight:800;font-size:clamp(48px,12vw,72px);line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.score small{font-size:.35em;-webkit-text-fill-color:var(--muted);color:var(--muted);font-weight:700}
.stars{display:flex;gap:6px}
.stars svg{width:30px;height:30px}
.stars .on{fill:var(--c3);animation:stamp .45s cubic-bezier(.3,1.8,.5,1) both}
.stars .off{fill:var(--line)}
.result p{margin:0;color:var(--muted)}
.result strong{color:var(--ink)}

.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.prog{flex:1;min-width:140px;display:grid;gap:4px}
.prog-label{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--c1),var(--c6),var(--c4),var(--c3),var(--c2));background-size:720px 100%;transition:width .3s cubic-bezier(.3,1.4,.5,1)}
button{font-family:var(--f-display);font-weight:800;font-size:16px;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;color:#fff;
  background:linear-gradient(120deg,var(--c1),var(--c5) 60%,var(--c2));box-shadow:0 6px 16px -8px var(--c5);transition:transform .15s}
button:hover{transform:translateY(-2px)} button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);box-shadow:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.hint{font-size:13px;color:var(--bad);width:100%;margin:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <span class="eyebrow">Fundamentos de computación</span>
    <h1><span class="hl hl1">Hardware</span>, <span class="hl hl2">software</span> y <span class="hl hl3">memoria</span></h1>
    <p class="lead">Elige una respuesta por pregunta. Al terminar presiona <strong>Calificar</strong> para ver tu puntaje y la explicación de cada respuesta.</p>
    <div class="meta"><span class="chip" style="--c:var(--c6)">10 preguntas</span><span class="chip" style="--c:var(--c4)">10 pts c/u</span><span class="chip" style="--c:var(--c3)">Total: 100 pts</span></div>
  </header>
  <section id="result" class="result" hidden aria-live="polite"></section>
  <form id="quiz" class="list" style="display:grid;gap:16px"></form>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="bar">
  <div class="bar-in">
    <div class="prog">
      <span class="prog-label" id="progLabel">0 de 10 contestadas</span>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button type="button" id="gradeBtn">Calificar</button>
    <button type="button" id="retryBtn" class="ghost" hidden>Intentar de nuevo</button>
    <p class="hint" id="hint" hidden></p>
  </div>
</div>

<script>
const QUESTIONS = [
  { q:"Es el componente que interpreta y ejecuta las instrucciones de los programas; se le conoce como el “cerebro” de la computadora.",
    opts:["Tarjeta de video","CPU (Unidad Central de Procesamiento)","Fuente de poder"], a:1,
    why:"La CPU procesa los datos y ejecuta las instrucciones. La tarjeta de video genera imágenes y la fuente de poder da energía." },
  { q:"Teclado, escáner y micrófono son ejemplos de…",
    opts:["Dispositivos de salida","Dispositivos de almacenamiento","Dispositivos de entrada"], a:2,
    why:"Los tres introducen información a la computadora, por eso son de entrada." },
  { q:"Esta memoria viene grabada de fábrica, no se borra al apagar la computadora y contiene las instrucciones de arranque.",
    opts:["RAM","ROM","Virtual"], a:1,
    why:"La ROM (Read Only Memory) es de solo lectura y no es volátil; guarda, por ejemplo, el firmware de arranque." },
  { q:"Memoria muy rápida y pequeña ubicada entre la CPU y la RAM, que guarda los datos que se usan con más frecuencia.",
    opts:["Memoria caché","Memoria secundaria","Memoria virtual"], a:0,
    why:"La caché acelera el trabajo de la CPU al tener a la mano los datos más usados." },
  { q:"La memoria RAM es volátil: su contenido se pierde cuando se apaga la computadora.",
    opts:["Verdadero","Falso"], a:0,
    why:"Por eso hay que guardar los archivos en un dispositivo de almacenamiento antes de apagar." },
  { q:"¿Cuántos bits forman un byte?",
    opts:["4","8","16"], a:1,
    why:"1 byte = 8 bits. Con un byte se puede representar, por ejemplo, un carácter de texto." },
  { q:"Una pantalla táctil y una impresora multifuncional (que imprime y escanea) son dispositivos…",
    opts:["Solo de entrada","Solo de salida","De entrada y salida (mixtos)"], a:2,
    why:"Ambos reciben información del usuario y también la muestran o producen, así que son mixtos." },
  { q:"Windows, macOS, Linux y Android son ejemplos de…",
    opts:["Software de aplicación","Sistemas operativos","Lenguajes de programación"], a:1,
    why:"Son software de sistema: administran el hardware y permiten que corran los demás programas." },
  { q:"Word, Excel y Google Chrome pertenecen al tipo de software de…",
    opts:["Sistema","Programación","Aplicación"], a:2,
    why:"El software de aplicación sirve para que el usuario realice tareas concretas: escribir, calcular, navegar." },
  { q:"¿Qué puerto se usa para conectar la computadora a una red cableada (Internet por cable)?",
    opts:["Puerto HDMI","Puerto Ethernet (RJ-45)","Puerto VGA"], a:1,
    why:"Ethernet (RJ-45) es el puerto de red. HDMI y VGA sirven para conectar pantallas." },
];

const form = document.getElementById('quiz');
const fill = document.getElementById('fill');
const progLabel = document.getElementById('progLabel');
const gradeBtn = document.getElementById('gradeBtn');
const retryBtn = document.getElementById('retryBtn');
const hint = document.getElementById('hint');
const result = document.getElementById('result');
let order = QUESTIONS.map((_, i) => i);
let graded = false;

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return arr; }

function render(){
  form.innerHTML = '';
  form.classList.remove('locked');
  order.forEach((qi, n) => {
    const Q = QUESTIONS[qi];
    const card = document.createElement('div');
    card.setAttribute('role','group');
    card.setAttribute('aria-labelledby', `qt${qi}`);
    card.className = 'q';
    card.style.setProperty('--c', `var(--c${n % 6 + 1})`);
        card.dataset.qi = qi;
    card.innerHTML = `
      <div class="q-head"><span class="q-num">Pregunta ${n+1}</span><span class="q-pts">10 pts</span></div>
      <p class="q-text" id="qt${qi}">${Q.q}</p>
      <div class="opts">${Q.opts.map((o, oi) => `
        <label class="opt" for="q${qi}o${oi}">
          <input type="radio" id="q${qi}o${oi}" name="q${qi}" value="${oi}">
          <span>${o}</span><span class="tag"></span>
        </label>`).join('')}
      </div>`;
    form.appendChild(card);
  });
  updateProgress();
}

function answered(){ return order.filter(qi => form.querySelector(`input[name="q${qi}"]:checked`)).length; }

function updateProgress(){
  const n = answered();
  progLabel.textContent = graded ? 'Examen calificado' : `${n} de ${QUESTIONS.length} contestadas`;
  fill.style.width = (graded ? 100 : n / QUESTIONS.length * 100) + '%';
  if (n === QUESTIONS.length) hint.hidden = true;
}

form.addEventListener('change', e => {
  updateProgress();
  const input = e.target, lab = input.closest('.opt');
  if (!lab) return;
  lab.classList.remove('pop'); void lab.offsetWidth; lab.classList.add('pop');
  const r = input.getBoundingClientRect();
  const c = getComputedStyle(lab.closest('.q')).getPropertyValue('--c').trim();
  burst(r.left + r.width/2, r.top + r.height/2, 16, [cssVar(c), ...palette()], 1);
});
form.addEventListener('submit', e => e.preventDefault());

gradeBtn.addEventListener('click', () => {
  const n = answered();
  if (n < QUESTIONS.length){
    hint.textContent = `Te faltan ${QUESTIONS.length - n} pregunta(s) por contestar.`;
    hint.hidden = false;
    const first = order.find(qi => !form.querySelector(`input[name="q${qi}"]:checked`));
    form.querySelector(`[data-qi="${first}"]`).scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  graded = true;
  let correct = 0;
  form.classList.add('locked');
  form.querySelectorAll('.q').forEach(card => {
    const qi = +card.dataset.qi, Q = QUESTIONS[qi];
    const chosen = +card.querySelector('input:checked').value;
    const ok = chosen === Q.a;
    if (ok) correct++;
    card.classList.add('graded', ok ? 'right' : 'miss');
    const st = document.createElement('span');
    st.className = 'stamp ' + (ok ? 'ok' : 'no');
    st.textContent = ok ? '+10 ★' : '0';
    card.appendChild(st);
    card.querySelectorAll('.opt').forEach((lab, oi) => {
      lab.querySelector('input').disabled = true;
      if (oi === Q.a){ lab.classList.add('correct'); lab.querySelector('.tag').textContent = 'Correcta'; }
      else if (oi === chosen){ lab.classList.add('wrong'); lab.querySelector('.tag').textContent = 'Tu respuesta'; }
    });
    const p = document.createElement('p');
    p.className = 'explain';
    p.textContent = Q.why;
    card.appendChild(p);
  });
  const pts = correct * 10;
  const msg = pts >= 90 ? '¡Excelente! Dominas el tema.' : pts >= 70 ? 'Bien. Revisa las preguntas marcadas en rojo.' : 'Repasa los temas marcados en rojo y vuelve a intentarlo.';
  const nStars = Math.round(correct / QUESTIONS.length * 5);
  const star = on => `<svg viewBox="0 0 24 24" class="${on ? 'on' : 'off'}"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.3 5.8 21.1l1.6-7L2 9.3l7.1-.7z"/></svg>`;
  result.innerHTML = `<span class="eyebrow">Resultado</span><div class="score"><span id="scoreNum">0</span><small> / 100 pts</small></div>
    <div class="stars" aria-label="${nStars} de 5 estrellas">${[0,1,2,3,4].map(i => star(i < nStars)).join('')}</div>
    <p><strong>${correct} de ${QUESTIONS.length} correctas.</strong> ${msg}</p>`;
  result.querySelectorAll('.stars .on').forEach((s, i) => s.style.animationDelay = (0.25 + i * 0.12) + 's');
  countUp(document.getElementById('scoreNum'), pts);
  setTimeout(() => celebrate(pts), 350);
  result.hidden = false;
  gradeBtn.hidden = true;
  retryBtn.hidden = false;
  updateProgress();
  window.scrollTo({top:0, behavior:'smooth'});
});

retryBtn.addEventListener('click', () => {
  graded = false;
  result.hidden = true;
  gradeBtn.hidden = false;
  retryBtn.hidden = true;
  order = shuffle(order.slice());
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

/* ---------- Efectos: estrellas y confeti ---------- */
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let parts = [], running = false;
function sizeFx(){ const d = devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize', sizeFx); sizeFx();
function cssVar(v){ const m = v.match(/var\((--[\w-]+)\)/); return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : v; }
function palette(){ return [1,2,3,4,5,6].map(i => cssVar(`var(--c${i})`)); }
function drawStar(x, y, r, rot){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){ const rr = i % 2 ? r * .45 : r, a = rot + i * Math.PI / 5; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function burst(x, y, n, colors, power){
  if (reduceMotion) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = (3 + Math.random() * 5) * power;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, g: .18, life: 1, decay: .018 + Math.random() * .015,
      r: 5 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, color: colors[i % colors.length], shape: 'star' });
  }
  loop();
}
function confetti(n, fromX, fromY, dirX){
  if (reduceMotion) return;
  const colors = palette();
  for (let i = 0; i < n; i++){
    const a = -Math.PI/2 + dirX * (0.35 + Math.random() * .5), sp = 9 + Math.random() * 9;
    parts.push({ x: fromX, y: fromY, vx: Math.cos(a) * sp * (dirX ? 1 : (Math.random()-.5)*2), vy: Math.sin(a) * sp, g: .25, life: 1, decay: .006 + Math.random() * .006,
      r: 4 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, color: colors[i % colors.length], shape: Math.random() < .3 ? 'star' : 'rect', drag: .985 });
  }
  loop();
}
function loop(){
  if (running) return; running = true;
  (function frame(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts){
      if (p.drag){ p.vx *= p.drag; p.vy *= p.drag; }
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); ctx.fillStyle = p.color;
      if (p.shape === 'star') drawStar(p.x, p.y, p.r, p.rot);
      else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r/2.5, p.r*2, p.r/1.25); ctx.restore(); }
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(frame); else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  })();
}
function celebrate(pts){
  const W = innerWidth, H = innerHeight;
  if (pts >= 90){ confetti(110, 0, H, 1); confetti(110, W, H, -1); setTimeout(() => { confetti(80, W*.25, H, 1); confetti(80, W*.75, H, -1); }, 450); }
  else if (pts >= 70){ confetti(70, 0, H, 1); confetti(70, W, H, -1); }
  else { burst(W/2, H*.3, 24, palette(), 1.2); }
}
function countUp(el, to){
  if (reduceMotion){ el.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  (function step(t){ const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); })(t0);
}

render();
</script>
